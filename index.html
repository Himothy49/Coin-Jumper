<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LAS CUP — Cutie Coin Dash</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10162b;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff}
body{display:grid;place-items:center}.wrap{position:relative;width:min(1100px,100vw);height:min(700px,100vh)}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;border-radius:18px;box-shadow:0 20px 70px #0008;background:#7bdcff}
button{font:800 16px system-ui;border:0;border-radius:12px;padding:11px 18px;background:#ffd447;color:#2b2340;cursor:pointer}
#menu{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;background:#10162bd9;border-radius:18px}
.panel{width:min(500px,90%);padding:28px;background:#18203bd9;border:2px solid #ffffff22;border-radius:22px;box-shadow:0 15px 50px #0007}
h1{margin:0 0 8px;font-size:48px;color:#ffe06b;letter-spacing:-2px}h2{margin:0 0 14px}.sub{opacity:.85;margin-bottom:20px}
#menu input{width:100%;padding:12px;border-radius:10px;border:2px solid #ffffff25;background:#0e1427;color:#fff;font-size:18px;margin:10px 0 14px;text-align:center}
#scores{text-align:left;max-height:230px;overflow:auto;margin:14px 0}.scoreRow{display:flex;justify-content:space-between;padding:7px 10px;border-radius:8px}.scoreRow:nth-child(odd){background:#ffffff08}
#hint{position:absolute;left:18px;bottom:14px;background:#10162dcc;padding:8px 12px;border-radius:10px;font-size:13px;pointer-events:none}
#touch{display:none;position:absolute;inset:auto 14px 14px;justify-content:space-between;pointer-events:none}.cluster{display:flex;gap:10px}
.touchBtn{pointer-events:auto;border:0;border-radius:14px;background:#10162ccc;color:#fff;width:60px;height:52px;font-size:21px;font-weight:900;touch-action:none}
@media(max-width:700px){#touch{display:flex}#hint{display:none}h1{font-size:38px}}
</style>
</head>
<body>
<div class="wrap">
<canvas id="game" width="1100" height="700"></canvas>
<div id="menu"><div class="panel" id="panel"></div></div>
<div id="hint">A/D or ←/→ move · Space/W/↑ jump · R restart · P pause</div>
<div id="touch"><div class="cluster"><button class="touchBtn" data-k="ArrowLeft">◀</button><button class="touchBtn" data-k="ArrowRight">▶</button></div><button class="touchBtn" data-k="Space">JUMP</button></div>
</div>
<script>
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),W=1100,H=700,menu=document.getElementById("menu"),panel=document.getElementById("panel");
const keys=new Set();
const state={screen:"title",level:1,score:0,coins:0,lives:3,cam:0,shake:0,paused:false,checkpoint:null,power:null,powerTimer:0,levelStartScore:0};
let platforms=[],coins=[],powerups=[],enemies=[],moving=[],particles=[],goalX=0,boss=null,last=performance.now(),acc=0;
const LEVELS=[
 {name:"Sunny Sprint",width:6100},
 {name:"Mushroom Meadow",width:6600},
 {name:"Sky Ruins",width:7100},
 {name:"Volcano Rush",width:7600},
 {name:"Nightmare Castle",width:8200}
];
const player={x:80,y:500,w:34,h:48,vx:0,vy:0,on:false,coyote:0,buffer:0,face:1,inv:0};
function keyDown(c){return keys.has(c)}
addEventListener("keydown",e=>{keys.add(e.code);if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code))e.preventDefault();if(e.code==="KeyR"&&state.screen!=="title")restartRun();if(e.code==="KeyP"&&state.screen==="play")state.paused=!state.paused});
addEventListener("keyup",e=>keys.delete(e.code));
document.querySelectorAll(".touchBtn").forEach(b=>{const on=()=>keys.add(b.dataset.k),off=()=>keys.delete(b.dataset.k);b.addEventListener("pointerdown",e=>{e.preventDefault();on()});b.addEventListener("pointerup",off);b.addEventListener("pointercancel",off);b.addEventListener("pointerleave",off)});

const SUPABASE_URL=window.CCD_SUPABASE_URL||"";
const SUPABASE_ANON_KEY=window.CCD_SUPABASE_ANON_KEY||"";
function localScores(){try{return JSON.parse(localStorage.getItem("ccdScores")||"[]").filter(x=>x&&Number.isFinite(x.score)).sort((a,b)=>b.score-a.score).slice(0,10)}catch{return[]}}
function scores(){return localScores()}
async function globalScores(){
 if(!SUPABASE_URL||!SUPABASE_ANON_KEY)return localScores();
 try{const r=await fetch(SUPABASE_URL+"/rest/v1/scores?select=name,score,coins&order=score.desc&limit=10",{headers:{apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+SUPABASE_ANON_KEY}});if(!r.ok)throw new Error("leaderboard");return await r.json()}catch{return localScores()}
}
async function saveScore(name,score){
 const row={name:(name||"PLAYER").trim().slice(0,12)||"PLAYER",score:Number(score)||0,coins:Number(state.coins)||0};
 const a=localScores();a.push(row);a.sort((x,y)=>y.score-x.score);try{localStorage.setItem("ccdScores",JSON.stringify(a.slice(0,10)))}catch{}
 if(SUPABASE_URL&&SUPABASE_ANON_KEY){try{await fetch(SUPABASE_URL+"/rest/v1/scores",{method:"POST",headers:{apikey:SUPABASE_ANON_KEY,Authorization:"Bearer "+SUPABASE_ANON_KEY,"Content-Type":"application/json",Prefer:"return=minimal"},body:JSON.stringify(row)})}catch{}}
}
function renderRows(a){return a.length?a.map((x,i)=>`<div class="scoreRow"><span>${i+1}. ${esc(x.name)}</span><b>${x.score}</b></div>`).join(""):"<div style='opacity:.7'>No scores yet — be the first!</div>"}
function menuTitle(){
 state.screen="title";menu.style.display="flex";panel.innerHTML=`<h1>⚡ CUTIE COIN DASH</h1><div class="sub">Run the office gauntlet. Collect $, survive evil computers and win the LAS CUP.</div><button id="start">START GAME</button><button id="board" style="margin-left:8px;background:#8ee7ff">HIGH SCORES</button>`;
 document.getElementById("start").onclick=()=>startRun();document.getElementById("board").onclick=showScores;
}
async function showScores(){
 panel.innerHTML=`<h2>🌎 LAS CUP WORLDWIDE</h2><div class="sub">Global top 10 scores</div><div id="scores"><div style='opacity:.7'>Loading leaderboard…</div></div><button id="back">BACK</button>`;
 document.getElementById("back").onclick=menuTitle;
 const a=await globalScores();const box=document.getElementById("scores");if(box)box.innerHTML=renderRows(a);
}
function esc(x){return String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function endScreen(win){
 state.screen=win?"win":"over";menu.style.display="flex";
 panel.innerHTML=win?`<h1>🏆 YOU DID IT!</h1><div class="sub">All 5 levels cleared.</div><div style="font-size:24px;margin:12px">Score: <b>${state.score}</b><br>Coins: ${state.coins}</div><input id="name" maxlength="12" placeholder="Your name"><button id="save">SAVE SCORE</button><button id="again" style="margin-left:8px;background:#8ee7ff">PLAY AGAIN</button>`:
 `<h1 style="color:#ff7188">GAME OVER</h1><div class="sub">You reached Level ${state.level}.</div><div style="font-size:24px;margin:12px">Score: <b>${state.score}</b><br>Coins: ${state.coins}</div><input id="name" maxlength="12" placeholder="Your name"><button id="save">SAVE SCORE</button><button id="again" style="margin-left:8px;background:#8ee7ff">RETRY</button>`;
 document.getElementById("save").onclick=async()=>{const b=document.getElementById("save");b.disabled=true;b.textContent="SAVING…";await saveScore(document.getElementById("name").value,state.score);showScores()};
 document.getElementById("again").onclick=()=>startRun();
}
function startRun(){state.score=0;state.coins=0;state.lives=3;state.level=1;state.cam=0;state.checkpoint=null;state.power=null;state.powerTimer=0;state.shake=0;state.screen="play";state.paused=false;menu.style.display="none";loadLevel(1)}
function restartRun(){if(state.screen==="play"||state.screen==="over"||state.screen==="win")startRun()}

function addCoins(x,y,n,dx=48){for(let i=0;i<n;i++)coins.push({x:x+i*dx,y:y+(i%2?-5:0),got:false,phase:Math.random()*6.28})}
function loadLevel(n){
 state.level=n;const width=LEVELS[n-1].width;goalX=width-155;
 platforms=[
 [0,585,850,115],[980,585,640,115],[1740,585,760,115],[2630,585,560,115],
 [3300,585,900,115],[4720,585,600,115],[5260,585,840,115]
 ];
 if(n>=2)platforms.push([6200,585,400,115]);if(n>=3)platforms.push([6700,585,400,115]);if(n>=4)platforms.push([7200,585,500,115]);if(n>=5)platforms.push([7700,585,500,115]);
 platforms.push([430,500,190,22],[700,440,150,22],[1120,490,180,22],[1370,420,160,22],[1840,500,180,22],[2140,430,190,22],[2410,500,130,22],[2740,455,170,22],[3020,390,170,22],[3430,500,190,22],[3740,425,190,22],[4070,500,180,22],[4430,445,170,22],[4830,485,170,22],[5480,450,180,22],[5740,385,170,22]);
 if(n>=2)platforms.push([6150,475,150,22],[6380,390,150,22]);if(n>=3)platforms.push([6630,470,150,22],[6870,365,150,22]);if(n>=4)platforms.push([7130,460,150,22],[7390,350,150,22]);if(n>=5)platforms.push([7620,450,150,22],[7860,330,150,22]);
 coins=[];addCoins(230,535,6);addCoins(450,460,4);addCoins(715,400,3);addCoins(1040,535,6);addCoins(1140,450,3);addCoins(1370,380,3);addCoins(1810,535,7);addCoins(1880,460,3);addCoins(2150,390,3);addCoins(2670,535,6);addCoins(2760,415,3);addCoins(3030,350,3);addCoins(3350,535,7);addCoins(3450,460,3);addCoins(3750,385,3);addCoins(4100,535,4);addCoins(4450,405,3);addCoins(4850,445,3);addCoins(5290,535,7);addCoins(5490,410,3);addCoins(5750,345,3);
 if(n>=2){addCoins(6150,435,4);addCoins(6380,350,3)}if(n>=3){addCoins(6630,430,4);addCoins(6870,325,3)}if(n>=4){addCoins(7130,420,4);addCoins(7390,310,3)}if(n>=5){addCoins(7620,410,4);addCoins(7860,290,3)}
 powerups=[{x:820,y:400,type:"dash",got:false},{x:1510,y:380,type:"shield",got:false},{x:2520,y:450,type:"super",got:false},{x:3990,y:375,type:"shield",got:false},{x:5200,y:420,type:"dash",got:false}];
 if(n>=2)powerups.push({x:6450,y:330,type:"super",got:false});if(n>=4)powerups.push({x:7300,y:300,type:"shield",got:false});
 enemies=[
 [610,547,42,38,1.15,20,830,"walker"],[1230,547,42,38,1.2,1000,1600,"walker"],[1540,547,42,38,1.25,1000,1600,"walker"],[1960,547,42,38,1.3,1750,2490,"walker"],
 [2260,392,42,38,1,2140,2330,"jumper"],[2890,547,42,38,1.3,2640,3180,"walker"],[3520,547,42,38,1.35,3310,4590,"walker"],[3890,387,42,38,1.05,3740,3930,"jumper"],
 [4250,547,42,38,1.35,3310,4590,"walker"],[4920,447,42,38,1.05,4830,5000,"jumper"],[5410,547,42,38,1.4,5270,6100,"walker"],[5900,347,42,38,1.15,5740,5910,"jumper"]
 ].map((a,i)=>enemyObj(a,i));
 if(n>=2)enemies.push(enemyObj([1100,547,42,38,1.7,1000,1600,"charger"],99),enemyObj([2800,547,42,38,1.7,2640,3180,"charger"],100),enemyObj([6350,547,42,38,1.3,6200,6600,"walker"],101));
 if(n>=3)enemies.push(enemyObj([2050,450,38,30,1.5,1900,2450,"flyer"],102),enemyObj([3450,455,38,30,1.6,3350,3900,"flyer"],103),enemyObj([6800,327,38,30,1.8,6700,7050,"flyer"],104));
 if(n>=4)enemies.push(enemyObj([3000,543,48,42,1,2640,3180,"tank"],105),enemyObj([4500,543,48,42,1,4200,4600,"tank"],106),enemyObj([7200,422,42,38,1.8,7130,7280,"charger"],107));
 if(n>=5)enemies.push(enemyObj([5500,547,42,38,1.9,5270,6100,"charger"],108),enemyObj([6750,543,48,42,1.05,6500,7050,"tank"],109),enemyObj([7780,292,42,38,1.7,7700,8000,"charger"],110));
 moving=[];
 if(n>=3){moving.push({x:6250,y:500,w:110,h:18,min:6200,max:6500,vx:2});moving.push({x:7000,y:470,w:110,h:18,min:6950,max:7100,vx:-2})}
 if(n>=4){moving.push({x:6500,y:430,w:120,h:18,min:6400,max:7000,vx:2.4});moving.push({x:7450,y:420,w:120,h:18,min:7250,max:7550,vx:-2.5})}
 if(n>=5){moving.push({x:8050,y:430,w:120,h:18,min:7950,max:8150,vx:2.8})}
 boss=n===5?{x:8020,y:495,w:78,h:90,hp:6,maxHp:6,vx:1.4,dir:1,hit:0,active:false}:null;
 player.x=state.checkpoint&&state.checkpoint.level===n?state.checkpoint.x:70;player.y=500;player.vx=player.vy=0;player.inv=60;state.levelStartScore=state.score;
}
function enemyObj(a,i){return{x:a[0],y:a[1],baseY:a[1],w:a[2],h:a[3],speed:a[4],vx:a[4]*(i%2?1:-1),left:a[5],right:a[6],type:a[7],alive:true,vy:0,t:60+(i%30)}}
function rect(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function solidLanding(oldY){
 player.on=false;
 const all=platforms.concat(moving.map(q=>[q.x,q.y,q.w,q.h]));
 for(const q of all)if(player.x+player.w>q[0]&&player.x<q[0]+q[2]){
   if(oldY+player.h<=q[1]&&player.y+player.h>=q[1]&&player.vy>=0){player.y=q[1]-player.h;player.vy=0;player.on=true}
   else if(oldY>=q[1]+q[3]&&player.y<=q[1]+q[3]&&player.vy<0){player.y=q[1]+q[3];player.vy=0}
 }
}
function hurt(){
 if(player.inv>0)return;
 if(state.power==="shield"){state.power=null;state.powerTimer=0;player.inv=90;burst(player.x+17,player.y+20,18);return}
 state.lives--;player.inv=110;state.shake=9;burst(player.x+17,player.y+20,12);
 if(state.lives<=0){endScreen(false);return}
 const cp=state.checkpoint&&state.checkpoint.level===state.level?state.checkpoint:{x:70,level:state.level};
 player.x=cp.x;player.y=400;player.vx=player.vy=0;
}
function update(){
 if(state.screen!=="play"||state.paused)return;
 const L=keyDown("ArrowLeft")||keyDown("KeyA"),R=keyDown("ArrowRight")||keyDown("KeyD"),J=keyDown("Space")||keyDown("ArrowUp")||keyDown("KeyW");
 const accel=state.power==="dash"?.95:.72,max=state.power==="dash"?9:6.5;
 if(L){player.vx-=accel;player.face=-1}if(R){player.vx+=accel;player.face=1}if(!L&&!R)player.vx*=.78;player.vx=Math.max(-max,Math.min(max,player.vx));
 player.buffer=J?8:Math.max(0,player.buffer-1);player.coyote=player.on?7:Math.max(0,player.coyote-1);
 if(player.buffer&&player.coyote){player.vy=state.power==="super"?-16:-13.5;player.on=false;player.buffer=0;burst(player.x+17,player.y+48,4)}
 if(!J&&player.vy<-5)player.vy+=.45;player.vy+=.65;
 player.x+=player.vx;player.x=Math.max(0,Math.min(levelWFor()-player.w,player.x));
 const old=player.y;player.y+=player.vy;solidLanding(old);
 player.inv=Math.max(0,player.inv-1);if(state.powerTimer>0)state.powerTimer--;else state.power=null;
 for(const q of moving){q.x+=q.vx;if(q.x<=q.min||q.x+q.w>=q.max)q.vx*=-1}
 for(const q of coins)if(!q.got){const yy=q.y+Math.sin(performance.now()/180+q.phase)*5;if(rect(player,{x:q.x-14,y:yy-14,w:28,h:28})){q.got=true;state.coins++;state.score+=100;burst(q.x,yy,7)}}
 for(const q of powerups)if(!q.got&&rect(player,{x:q.x-18,y:q.y-18,w:36,h:36})){q.got=true;state.power=q.type;state.powerTimer=q.type==="super"?600:480;state.score+=300;burst(q.x,q.y,18)}
 for(const e of enemies)if(e.alive){
   if(e.type==="flyer"){e.x+=e.vx;e.y=e.baseY+Math.sin(performance.now()/260+e.t)*32}
   else{e.x+=e.vx;e.y=e.baseY;if(e.type==="jumper"){e.t--;if(e.t<=0&&e.vy===0){e.vy=-8;e.t=100}e.vy+=.45;e.y+=e.vy}
   if(e.type==="charger"&&Math.abs(player.x-e.x)<260)e.vx=(player.x<e.x?-1:1)*e.speed*1.8;if(e.x<=e.left){e.x=e.left;e.vx=Math.abs(e.speed)}if(e.x+e.w>=e.right){e.x=e.right-e.w;e.vx=-Math.abs(e.speed)}}
   if(rect(player,e)){const stomp=player.vy>1&&player.y+player.h-e.y<20;if(stomp&&e.type!=="tank"){e.alive=false;player.vy=-9;state.score+=e.type==="charger"?350:250;burst(e.x+e.w/2,e.y+10,13)}else hurt()}
 }
 if(boss){boss.active=player.x>goalX-500;boss.x+=boss.vx;if(boss.x<7750||boss.x>levelW-100)boss.vx*=-1;
   if(boss.active&&rect(player,boss)){const stomp=player.vy>1&&player.y+player.h-boss.y<22;if(stomp){boss.hp--;player.vy=-11;state.score+=500;burst(boss.x+40,boss.y+20,20);if(boss.hp<=0){boss=null;state.score+=5000}}else hurt()}
 }
 if(player.y>760){hurt();if(state.screen!=="play")return}
 if(!state.checkpoint&&player.x>3200){state.checkpoint={level:state.level,x:3350};state.score+=500}
 if(player.x>goalX&&!boss){state.score+=1000;if(state.level<5){loadLevel(state.level+1);state.levelStartScore=state.score}else endScreen(true)}
 state.cam+=(player.x-350-state.cam)*.09;state.cam=Math.max(0,Math.min(levelWFor()-W,state.cam));if(state.shake>0)state.shake--;
 particles.forEach(a=>{a.x+=a.vx;a.y+=a.vy;a.vy+=.15;a.t--});particles=particles.filter(a=>a.t>0)
}
function levelWFor(){return LEVELS[state.level-1].width}
function burst(x,y,n=10){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.7)*5,t:25+Math.random()*20})}
function px(x,y,w,h){ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function drawHero(x,y){
 const t=performance.now()/1000,bob=player.on?Math.sin(t*10)*1.2:Math.sin(t*7)*2,step=player.on&&Math.abs(player.vx)>.7?Math.sin(t*18)*3:0;
 ctx.save();ctx.translate(Math.round(x),Math.round(y+bob));ctx.scale(player.face,1);
 ctx.fillStyle="#352442";px(2,44,31,5);
 // ambiguous office worker: neat hair, shirt, tie, ID badge, trousers and briefcase
 ctx.fillStyle="#20233a";px(9,1,21,8);px(6,5,27,7);
 ctx.fillStyle="#f0c6a4";px(8,9,25,23);px(11,5,19,8);
 ctx.fillStyle="#20233a";px(10,16,5,6);px(25,16,5,6);ctx.fillStyle="#fff";px(11,16,2,2);px(26,16,2,2);
 ctx.fillStyle="#d89d82";px(17,24,8,3);ctx.fillStyle="#4a2942";px(19,28,5,2);
 ctx.fillStyle="#f7f7f2";px(7,30,28,17);px(12,27,18,7);
 ctx.fillStyle="#d83d5b";px(19,31,5,13);px(17,31,9,4);
 ctx.fillStyle="#8ee7ff";px(27,34,7,9);ctx.fillStyle="#17213b";px(29,35,3,3);
 ctx.fillStyle="#f0c6a4";px(2,34,8,8);px(32,34,8,8);
 ctx.fillStyle="#26304b";px(7,44+Math.max(0,step),11,9);px(24,44+Math.max(0,-step),11,9);
 ctx.fillStyle="#fff";px(4,49+Math.max(0,step),15,4);px(22,49+Math.max(0,-step),15,4);
 // briefcase
 ctx.fillStyle="#7b4b35";px(-6,37,12,10);ctx.fillStyle="#e5b64e";px(-2,35,5,3);
 if(state.power){ctx.globalAlpha=.28+.12*Math.sin(t*9);ctx.strokeStyle=state.power==="shield"?"#66e3ff":state.power==="super"?"#ff6bc5":"#8df06a";ctx.lineWidth=3;ctx.strokeRect(-2,0,43,54);ctx.globalAlpha=1}
 ctx.restore();
}
function drawEnemy(e){
 const x=e.x,y=e.y;ctx.save();
 // Evil computers with distinct hardware/function silhouettes
 if(e.type==="flyer"){ctx.fillStyle="#55627f";px(x+7,y+8,28,23);px(x+1,y+14,8,7);px(x+33,y+14,8,7);ctx.fillStyle="#1b2035";px(x+11,y+13,20,12);ctx.fillStyle="#ff465f";px(x+15,y+16,4,4);px(x+24,y+16,4,4);ctx.fillStyle="#9aa8c2";px(x+11,y+2,20,6);}
 else if(e.type==="tank"){ctx.fillStyle="#3c465e";px(x+2,y+8,44,31);px(x+8,y+2,32,10);ctx.fillStyle="#151a2b";px(x+10,y+16,28,11);ctx.fillStyle="#ff4058";px(x+14,y+18,5,5);px(x+28,y+18,5,5);ctx.fillStyle="#8996ad";px(x-2,y+38,14,5);px(x+36,y+38,14,5);}
 else if(e.type==="charger"){ctx.fillStyle="#7b3f5b";px(x+4,y+8,34,28);px(x+9,y+3,24,8);ctx.fillStyle="#172039";px(x+10,y+14,24,12);ctx.fillStyle="#ff4058";px(x+13,y+17,5,5);px(x+26,y+17,5,5);ctx.fillStyle="#e9b44c";px(x+15,y+27,13,4);px(x-3,y+32,8,5);}
 else {ctx.fillStyle="#59677f";px(x+5,y+7,32,29);px(x+10,y+2,22,7);ctx.fillStyle="#151a2b";px(x+9,y+14,24,12);ctx.fillStyle="#ff4058";px(x+12,y+17,5,5);px(x+27,y+17,5,5);ctx.fillStyle="#63d7ff";px(x+16,y+27,10,4);ctx.fillStyle="#aab5c7";px(x+1,y+36,9,4);px(x+32,y+36,9,4);}
 ctx.restore();
}
function draw(){
 const t=performance.now()/1000;ctx.save();ctx.translate(-state.cam+(state.shake?Math.random()*state.shake-state.shake/2:0),0);
 ctx.fillStyle="#7bdcff";ctx.fillRect(state.cam-20,0,W+40,H);ctx.fillStyle="#fff6b3";ctx.beginPath();ctx.arc(state.cam+820,115,52,0,7);ctx.fill();
 ctx.fillStyle="#58c98c";for(let i=-1;i<13;i++){let x=state.cam+i*700;ctx.beginPath();ctx.moveTo(x,585);ctx.lineTo(x+280,300);ctx.lineTo(x+560,585);ctx.fill()}
 for(const q of platforms){ctx.fillStyle="#77d46b";px(q[0],q[1],q[2],12);ctx.fillStyle="#a85e3b";px(q[0],q[1]+12,q[2],q[3]-12)}
 for(const q of moving){ctx.fillStyle="#e6a24b";px(q.x,q.y,q.w,q.h);ctx.fillStyle="#fff0a0";px(q.x+8,q.y+4,q.w-16,4)}
 if(state.level===5){
   ctx.fillStyle="#6b4760";px(goalX+25,405,10,150);ctx.fillStyle="#d6a63e";px(goalX+15,550,30,7);
   ctx.fillStyle="#f7cf55";ctx.beginPath();ctx.arc(goalX+30,390,23,0,7);ctx.fill();ctx.fillStyle="#9b5d2e";ctx.fillRect(goalX+17,372,26,9);
   ctx.fillStyle="#f9e58b";ctx.fillRect(goalX+5,375,9,23);ctx.fillRect(goalX+46,375,9,23);ctx.fillStyle="#b77a27";ctx.fillRect(goalX+22,409,16,8);
   ctx.fillStyle="#fff3a8";ctx.font="900 15px system-ui";ctx.textAlign="center";ctx.fillText("LAS CUP",goalX+30,440);ctx.textAlign="left";
 }else{ctx.fillStyle="#593c75";px(goalX,360,8,225);ctx.fillStyle="#ff5e83";px(goalX+8,360,92,52);ctx.fillStyle="#ffe06b";ctx.beginPath();ctx.arc(goalX+4,348,12,0,7);ctx.fill();}
 for(const q of coins)if(!q.got){const yy=q.y+Math.sin(t*4+q.phase)*5;ctx.fillStyle="#49d17d";ctx.font="900 24px system-ui";ctx.textAlign="center";ctx.fillText("$",q.x,yy+8);ctx.textAlign="left"}
 for(const q of powerups)if(!q.got){const yy=q.y+Math.sin(t*4+q.x)*6;ctx.fillStyle=q.type==="shield"?"#66e3ff":q.type==="super"?"#ff6bc5":"#8df06a";ctx.beginPath();ctx.arc(q.x,yy,17,0,7);ctx.fill();ctx.fillStyle="#18203a";ctx.font="900 18px system-ui";ctx.textAlign="center";ctx.fillText(q.type==="shield"?"S":q.type==="super"?"★":"D",q.x,yy+7);ctx.textAlign="left"}
 for(const e of enemies)if(e.alive)drawEnemy(e);
 if(boss){ctx.fillStyle="#7b315f";px(boss.x,boss.y,boss.w,boss.h);ctx.fillStyle="#ffcc59";px(boss.x+12,boss.y+16,12,10);px(boss.x+52,boss.y+16,12,10);ctx.fillStyle="#fff";px(boss.x+16,boss.y+20,4,4);px(boss.x+56,boss.y+20,4,4);ctx.fillStyle="#ff7188";px(boss.x+27,boss.y+48,25,8)}
 if(player.inv%8<4)drawHero(player.x,player.y);for(const a of particles){ctx.fillStyle="#fff0a0";px(a.x,a.y,5,5)}ctx.restore();
 ctx.fillStyle="#10162ddd";ctx.fillRect(16,16,505,88);ctx.fillStyle="#ffe06b";ctx.font="900 13px system-ui";ctx.fillText("⚡ CUTIE",445,38);ctx.fillStyle="#fff";ctx.font="bold 17px system-ui";ctx.fillText(`LEVEL ${state.level}/5 • ${LEVELS[state.level-1].name}`,30,40);ctx.fillText(`$ ${state.coins} • SCORE ${state.score}`,30,64);ctx.fillText(`♥ ${state.lives}   BEST ${scores()[0]?.score||0}`,30,88);
 if(state.power){ctx.fillStyle="#8ee7ff";ctx.fillText(`POWER ${state.power.toUpperCase()} ${Math.ceil(state.powerTimer/60)}s`,275,88)}
 if(boss&&boss.active){ctx.fillStyle="#10162ddd";ctx.fillRect(W/2-190,18,380,28);ctx.fillStyle="#ff7188";ctx.fillRect(W/2-184,24,368*(boss.hp/boss.maxHp),16);ctx.strokeStyle="#fff";ctx.strokeRect(W/2-190,18,380,28)}
 if(state.paused){ctx.fillStyle="#10162be8";ctx.fillRect(0,0,W,H);ctx.textAlign="center";ctx.font="900 55px system-ui";ctx.fillStyle="#ffe06b";ctx.fillText("PAUSED",W/2,300);ctx.font="600 18px system-ui";ctx.fillStyle="#fff";ctx.fillText("Press P to continue",W/2,345);ctx.textAlign="left"}}
function loop(now){const dt=Math.min(50,now-last);last=now;acc+=dt;while(acc>=16.666){update();acc-=16.666}draw();requestAnimationFrame(loop)}
menuTitle();requestAnimationFrame(loop);
</script></body></html>
