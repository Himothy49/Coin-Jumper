<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cutie Coin Dash — 5 Levels</title>
<style>
html,body{margin:0;height:100%;background:#10162b;overflow:hidden;font-family:system-ui;color:white}
body{display:grid;place-items:center}#wrap{width:min(1100px,100vw);height:min(700px,100vh);position:relative}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;border-radius:18px;box-shadow:0 20px 70px #0008}
#hint{position:absolute;left:18px;bottom:14px;background:#10162dcc;padding:8px 12px;border-radius:10px;font-size:13px}
#touch{display:none;position:absolute;inset:auto 14px 14px;justify-content:space-between}.cluster{display:flex;gap:10px}
button{border:0;border-radius:14px;background:#10162ccc;color:#fff;width:58px;height:52px;font-size:22px;font-weight:800}
@media(max-width:700px){#touch{display:flex}#hint{display:none}}
</style></head><body><div id="wrap"><canvas id="game" width="1100" height="700"></canvas>
<div id="hint">A/D or ←/→ move · Space/W/↑ jump · R restart</div>
<div id="touch"><div class="cluster"><button data-k="ArrowLeft">◀</button><button data-k="ArrowRight">▶</button></div><button data-k="Space">JUMP</button></div></div>
<script>
"use strict";
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),W=1100,H=700;
const keys=new Set();addEventListener("keydown",e=>{keys.add(e.code);if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code))e.preventDefault();if(e.code==="KeyR")reset()});
addEventListener("keyup",e=>keys.delete(e.code));
document.querySelectorAll("button").forEach(b=>{b.onpointerdown=()=>keys.add(b.dataset.k);b.onpointerup=b.onpointerleave=()=>keys.delete(b.dataset.k)});

const names=["Sunny Sprint","Mushroom Meadow","Sky Ruins","Volcano Rush","Nightmare Castle"];
let level=1,levelW=6100,platforms=[],coins=[],powerups=[],enemies=[],particles=[],cam=0,won=false,gameOver=false,shake=0;
let best=Number(localStorage.cutieBest||0);
const p={x:80,y:500,w:34,h:48,vx:0,vy:0,on:false,coyote:0,buffer:0,face:1,inv:0,lives:3,score:0,coins:0};
let power={type:null,timer:0};

function build(n){
 level=n;levelW=[0,6100,6600,7100,7600,8200][n];
 platforms=[
 [0,585,850,115],[980,585,640,115],[1740,585,760,115],[2630,585,560,115],
 [3300,585,900,115],[4720,585,600,115],[5260,585,840,115]];
 if(n>=2)platforms.push([6200,585,400,115]);if(n>=3)platforms.push([6700,585,400,115]);
 if(n>=4)platforms.push([7200,585,500,115]);if(n>=5)platforms.push([7700,585,500,115]);
 platforms.push([430,500,190,22],[700,440,150,22],[1120,490,180,22],[1370,420,160,22],
 [1840,500,180,22],[2140,430,190,22],[2410,500,130,22],[2740,455,170,22],[3020,390,170,22],
 [3430,500,190,22],[3740,425,190,22],[4070,500,180,22],[4430,445,170,22],[4830,485,170,22],
 [5480,450,180,22],[5740,385,170,22]);
 if(n>=2)platforms.push([6150,475,150,22],[6380,390,150,22]);
 if(n>=3)platforms.push([6630,470,150,22],[6870,365,150,22]);
 if(n>=4)platforms.push([7130,460,150,22],[7390,350,150,22]);
 if(n>=5)platforms.push([7620,450,150,22],[7860,330,150,22]);

 coins=[];const add=(x,y,num,dx=48)=>{for(let i=0;i<num;i++)coins.push({x:x+i*dx,y:y+(i%2?-5:0),got:false,b:Math.random()*6.28})};
 add(230,535,6);add(450,460,4);add(715,400,3);add(1040,535,6);add(1140,450,3);add(1370,380,3);
 add(1810,535,7);add(1880,460,3);add(2150,390,3);add(2670,535,6);add(2760,415,3);add(3030,350,3);
 add(3350,535,7);add(3450,460,3);add(3750,385,3);add(4100,535,4);add(4450,405,3);add(4850,445,3);
 add(5290,535,7);add(5490,410,3);add(5750,345,3);
 if(n>=2){add(6150,435,4);add(6380,350,3)}if(n>=3){add(6630,430,4);add(6870,325,3)}
 if(n>=4){add(7130,420,4);add(7390,310,3)}if(n>=5){add(7620,410,4);add(7860,290,3)}

 powerups=[{x:820,y:400,type:"dash",got:false},{x:1510,y:380,type:"shield",got:false},
 {x:2520,y:450,type:"super",got:false},{x:3990,y:375,type:"shield",got:false},{x:5200,y:420,type:"dash",got:false}];
 if(n>=2)powerups.push({x:6450,y:330,type:"super",got:false});if(n>=4)powerups.push({x:7300,y:300,type:"shield",got:false});

 const d=[
 [610,547,42,38,1.15,20,830,"walker"],[1230,547,42,38,1.2,1000,1600,"walker"],
 [1540,547,42,38,1.25,1000,1600,"walker"],[1960,547,42,38,1.3,1750,2490,"walker"],
 [2260,392,42,38,1,2140,2330,"jumper"],[2890,547,42,38,1.3,2640,3180,"walker"],
 [3520,547,42,38,1.35,3310,4590,"walker"],[3890,387,42,38,1.05,3740,3930,"jumper"],
 [4250,547,42,38,1.35,3310,4590,"walker"],[4920,447,42,38,1.05,4830,5000,"jumper"],
 [5410,547,42,38,1.4,5270,6100,"walker"],[5900,347,42,38,1.15,5740,5910,"jumper"]];
 if(n>=2)d.push([1100,547,42,38,1.7,1000,1600,"charger"],[2800,547,42,38,1.7,2640,3180,"charger"],[6350,547,42,38,1.3,6200,6600,"walker"]);
 if(n>=3)d.push([2050,450,38,30,1.5,1900,2450,"flyer"],[3450,455,38,30,1.6,3350,3900,"flyer"],[6800,327,38,30,1.8,6700,7050,"flyer"]);
 if(n>=4)d.push([3000,543,48,42,1,2640,3180,"tank"],[4500,543,48,42,1,4200,4600,"tank"],[7200,422,42,38,1.8,7130,7280,"charger"]);
 if(n>=5)d.push([5500,547,42,38,1.9,5270,6100,"charger"],[6750,543,48,42,1.05,6500,7050,"tank"],[7780,292,42,38,1.7,7700,8000,"charger"]);
 enemies=d.map((a,i)=>({x:a[0],y:a[1],baseY:a[1],w:a[2],h:a[3],speed:a[4],vx:a[4]*(i%2?1:-1),left:a[5],right:a[6],type:a[7],alive:true,vy:0,t:Math.random()*100}));
}
function reset(){p.x=80;p.y=500;p.vx=p.vy=0;p.lives=3;p.score=0;p.coins=0;p.inv=0;cam=0;won=false;gameOver=false;power={type:null,timer:0};particles=[];build(1)}
function burst(x,y,n=10){for(let i=0;i<n;i++)particles.push({x,y,vx:(Math.random()-.5)*5,vy:(Math.random()-.7)*5,t:25+Math.random()*20})}
function hit(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y}
function update(){
 if(won||gameOver)return;
 const L=keys.has("ArrowLeft")||keys.has("KeyA"),R=keys.has("ArrowRight")||keys.has("KeyD"),J=keys.has("Space")||keys.has("ArrowUp")||keys.has("KeyW");
 const accel=power.type==="dash"?.95:.72,max=power.type==="dash"?9:6.5;
 if(L){p.vx-=accel;p.face=-1}if(R){p.vx+=accel;p.face=1}if(!L&&!R)p.vx*=.78;p.vx=Math.max(-max,Math.min(max,p.vx));
 p.buffer=J?8:Math.max(0,p.buffer-1);p.coyote=p.on?7:Math.max(0,p.coyote-1);
 if(p.buffer&&p.coyote){p.vy=power.type==="super"?-16:-13.5;p.on=false;p.buffer=0;burst(p.x+17,p.y+48,5)}
 if(!J&&p.vy<-5)p.vy+=.45;p.vy+=.65;p.x+=p.vx;p.x=Math.max(0,Math.min(levelW-p.w,p.x));
 const old=p.y;p.y+=p.vy;p.on=false;
 for(const q of platforms)if(p.x+p.w>q[0]&&p.x<q[0]+q[2]){
   if(old+p.h<=q[1]&&p.y+p.h>=q[1]&&p.vy>=0){p.y=q[1]-p.h;p.vy=0;p.on=true}
   else if(old>=q[1]+q[3]&&p.y<=q[1]+q[3]&&p.vy<0){p.y=q[1]+q[3];p.vy=0}
 }
 p.inv=Math.max(0,p.inv-1);
 for(const q of coins)if(!q.got){let yy=q.y+Math.sin(performance.now()/180+q.b)*5;if(p.x<q.x+18&&p.x+p.w>q.x-18&&p.y<yy+18&&p.y+p.h>yy-18){q.got=true;p.coins++;p.score+=100;burst(q.x,yy,8)}}
 for(const q of powerups)if(!q.got&&hit(p,{x:q.x-18,y:q.y-18,w:36,h:36})){q.got=true;power.type=q.type;power.timer=q.type==="super"?600:480;p.score+=300;burst(q.x,q.y,18)}
 if(power.timer>0)power.timer--;else power.type=null;
 for(const e of enemies)if(e.alive){
   if(e.type==="flyer"){e.x+=e.vx;e.y=e.baseY+Math.sin(performance.now()/260+e.t)*32}
   else{e.x+=e.vx;e.y=e.baseY;if(e.type==="jumper"){e.t--;if(e.t<=0&&e.vy===0){e.vy=-8;e.t=100}e.vy+=.45;e.y+=e.vy;if(e.y>e.baseY){e.y=e.baseY;e.vy=0}}if(e.type==="charger"&&Math.abs(p.x-e.x)<260)e.vx=(p.x<e.x?-1:1)*e.speed*1.8;
   if(e.x<=e.left){e.x=e.left;e.vx=Math.abs(e.speed)}if(e.x+e.w>=e.right){e.x=e.right-e.w;e.vx=-Math.abs(e.speed)}}
   if(hit(p,e)){let stomp=p.vy>1&&p.y+p.h-e.y<20;if(stomp&&e.type!=="tank"){e.alive=false;p.vy=-9;p.score+=e.type==="charger"?350:250;burst(e.x+e.w/2,e.y+10,14)}
   else if(power.type==="shield"){power={type:null,timer:0};p.inv=90;burst(p.x+17,p.y+20,20)}
   else if(p.inv===0){p.lives--;p.inv=100;shake=10;burst(p.x+17,p.y+20,12);if(p.lives<=0){gameOver=true;return}p.x=Math.max(60,p.x-160);p.y=400;p.vy=-8}}
 }
 if(p.y>760){p.lives--;if(p.lives<=0){gameOver=true;return}p.x=Math.max(60,p.x-220);p.y=400;p.vy=-8;p.inv=100}
 if(p.x>levelW-230){p.score+=1000;best=Math.max(best,p.score);localStorage.cutieBest=best;if(level<5){build(++level);p.x=70;p.y=500;p.vx=p.vy=0;p.inv=60;cam=0;power={type:null,timer:0}}else{won=true;burst(p.x,p.y,40)}}
 cam+=(p.x-350-cam)*.09;cam=Math.max(0,Math.min(levelW-W,cam));if(shake>0)shake--;
 particles.forEach(a=>{a.x+=a.vx;a.y+=a.vy;a.vy+=.15;a.t--});particles=particles.filter(a=>a.t>0)
}
function box(x,y,w,h){ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function hero(x,y){ctx.save();ctx.translate(x,y);ctx.scale(p.face,1);
ctx.fillStyle="#4b315f";box(5,39,25,9);ctx.fillStyle="#f5c542";box(6,10,27,27);box(10,4,22,13);box(3,0,10,17);box(27,0,10,17);
ctx.fillStyle="#51364d";box(4,0,8,7);box(29,0,7,7);ctx.fillStyle="#20233d";box(12,16,5,6);box(26,16,5,6);ctx.fillStyle="#fff";box(13,16,2,2);box(27,16,2,2);
ctx.fillStyle="#ef596f";box(5,25,8,7);box(30,25,7,7);ctx.fillStyle="#5b5fe0";box(7,34,25,10);box(14,30,13,6);ctx.fillStyle="#8ee7ff";box(12,36,15,5);
ctx.fillStyle="#f5c542";box(30,33,9,7);box(36,27,8,9);box(42,20,7,10);box(39,18,8,5);ctx.fillStyle="#5a3c77";box(7,42,10,6);box(24,42,10,6);ctx.restore()}
function enemy(e){let x=e.x,y=e.y;ctx.save();if(e.type==="flyer"){ctx.fillStyle="#b26cff";box(x+5,y+10,30,22);box(x-3,y+14,10,10);box(x+34,y+14,10,10);ctx.fillStyle="#20233d";box(x+11,y+16,5,6);box(x+26,y+16,5,6)}
else if(e.type==="tank"){ctx.fillStyle="#4b536d";box(x+3,y+8,42,29);box(x+8,y+2,32,12);ctx.fillStyle="#a7b3c8";box(x+10,y+16,8,7);box(x+30,y+16,8,7);ctx.fillStyle="#ef5d78";box(x+17,y+28,15,5)}
else if(e.type==="charger"){ctx.fillStyle="#ef6b45";box(x+4,y+9,34,26);box(x+9,y+4,24,10);ctx.fillStyle="#20233d";box(x+11,y+15,5,6);box(x+27,y+15,5,6);ctx.fillStyle="#ffd45b";box(x+15,y+25,13,5)}
else{ctx.fillStyle="#6b4b9a";box(x+5,y+10,32,23);box(x+10,y+5,22,8);ctx.fillStyle="#f7d6c3";box(x+9,y+17,7,7);box(x+27,y+17,7,7);ctx.fillStyle="#25233b";box(x+11,y+17,4,5);box(x+28,y+17,4,5);ctx.fillStyle="#ff7a8a";box(x+15,y+25,13,5)}ctx.restore()}
function draw(){
 const t=performance.now()/1000;ctx.save();ctx.translate(-(cam)+(shake?Math.random()*shake-shake/2:0),0);
 ctx.fillStyle="#7bdcff";ctx.fillRect(cam-20,0,W+40,H);ctx.fillStyle="#fff6b3";ctx.beginPath();ctx.arc(cam+820,115,52,0,7);ctx.fill();
 ctx.fillStyle="#58c98c";for(let i=-1;i<12;i++){let x=cam+i*700;ctx.beginPath();ctx.moveTo(x,585);ctx.lineTo(x+280,300);ctx.lineTo(x+560,585);ctx.fill()}
 for(const q of platforms){ctx.fillStyle="#77d46b";box(q[0],q[1],q[2],12);ctx.fillStyle="#a85e3b";box(q[0],q[1]+12,q[2],q[3]-12)}
 ctx.fillStyle="#593c75";box(levelW-145,360,8,225);ctx.fillStyle="#ff5e83";box(levelW-137,360,92,52);ctx.fillStyle="#ffe06b";ctx.beginPath();ctx.arc(levelW-141,348,12,0,7);ctx.fill();
 for(const q of coins)if(!q.got){let yy=q.y+Math.sin(t*4+q.b)*5;ctx.fillStyle="#ffd447";ctx.beginPath();ctx.arc(q.x,yy,11,0,7);ctx.fill()}
 for(const q of powerups)if(!q.got){let yy=q.y+Math.sin(t*4+q.x)*6;ctx.fillStyle=q.type==="shield"?"#66e3ff":q.type==="super"?"#ff6bc5":"#8df06a";ctx.beginPath();ctx.arc(q.x,yy,17,0,7);ctx.fill();ctx.fillStyle="#18203a";ctx.font="900 18px system-ui";ctx.textAlign="center";ctx.fillText(q.type==="shield"?"S":q.type==="super"?"★":"D",q.x,yy+7);ctx.textAlign="left"}
 for(const e of enemies)if(e.alive)enemy(e);if(p.inv%8<4)hero(p.x,p.y);for(const a of particles){ctx.fillStyle="#fff0a0";box(a.x,a.y,5,5)}ctx.restore();
 ctx.fillStyle="#10162bdd";ctx.fillRect(16,16,430,80);ctx.fillStyle="#fff";ctx.font="bold 17px system-ui";ctx.fillText(`LEVEL ${level}/5 • ${names[level-1]}`,30,40);ctx.fillText(`COINS ${p.coins}/${coins.length} • SCORE ${p.score}`,30,64);ctx.fillText(`♥ ${"♥".repeat(p.lives)}   BEST ${best}`,30,87);if(power.type){ctx.fillStyle="#8ee7ff";ctx.fillText(`POWER ${power.type.toUpperCase()} ${Math.ceil(power.timer/60)}s`,225,87)}
 if(gameOver||won){ctx.fillStyle="#10162bef";ctx.fillRect(0,0,W,H);ctx.textAlign="center";ctx.fillStyle=won?"#ffe06b":"#ff7188";ctx.font="900 62px system-ui";ctx.fillText(won?"ALL 5 LEVELS CLEAR!":"GAME OVER",W/2,270);ctx.fillStyle="#fff";ctx.font="700 24px system-ui";ctx.fillText(`Score ${p.score}`,W/2,320);ctx.font="600 18px system-ui";ctx.fillText("Press R to play again",W/2,365);ctx.textAlign="left"}}
function loop(){try{update();draw()}catch(err){console.error(err);reset()}requestAnimationFrame(loop)}reset();loop();
</script></body></html>
